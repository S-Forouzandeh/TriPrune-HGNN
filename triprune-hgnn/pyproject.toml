[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triprune-hgnn"
version = "0.1.0"
description = "Adaptive hypergraph pruning with learned threshold control and attention-based negative mining"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["torch>=2.0", "numpy>=1.23", "scipy>=1.9", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["triprune*"]
